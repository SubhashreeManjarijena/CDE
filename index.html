issue:e=>{const c=cs(e.c),n=c.ncrs.find(x=>x.id===e.n),l=n.lines[+e.j],left=l.qty-l.issued;modal('Issue material',`<p>${E(l.mat)} — ${left} remaining</p>${F('Quantity to issue','q',String(left),{t:'number',req:1})}`,(f,v)=>{if(!(+v.q>0)||+v.q>left)return{q:'Enter a quantity between 1 and '+left};l.issued+=+v.q;S.stock.push({id:'MOV-'+String(S.stock.length+1).padStart(3,'0'),at:new Date().toISOString(),type:'Issue',item:l.mat,n:n.id,c:c.id,qty:+v.q,by:me.id,note:'Issued to '+usr(c.eng).name});log(c,'Material issued',l.mat+' × '+v.q);toast('Saved: issued '+v.q+' × '+l.mat);return 1})},
rev:e=>{const m=S.stock.find(x=>x.id===e.id);modal('Reverse '+m.id,`<p class="mu">The original movement is never edited. A reversal and a replacement record are added.</p>${F('Reason','why','',{req:1})}${F('Replacement quantity (0 for none)','q',String(m.qty),{t:'number',req:1})}`,(f,v)=>{const er={};if(!v.why.trim())er.why='A reason is required';if(v.q===''||+v.q<0||+v.q>m.qty)er.q='Enter 0 to '+m.qty;if(Object.keys(er).length)return er;const c=cs(m.c),l=c.ncrs.find(x=>x.id===m.n).lines.find(x=>x.mat===m.item),id=()=>'MOV-'+String(S.stock.length+1).padStart(3,'0');S.stock.push({id:id(),at:new Date().toISOString(),type:'Reversal',item:m.item,n:m.n,c:m.c,qty:-m.qty,by:me.id,note:v.why,rev:m.id});l.issued-=m.qty;if(+v.q>0){S.stock.push({id:id(),at:new Date().toISOString(),type:'Issue',item:m.item,n:m.n,c:m.c,qty:+v.q,by:me.id,note:'Replacement for '+m.id});l.issued+=+v.q}log(c,'Stock reversal',m.id+': '+v.why);toast('Saved: reversal + replacement recorded');return 1})},
clo:e=>{const c=cs(e.id),b=blockers(c),T={res:'Internal resolution',app:'Supervisor approval',acc:'Customer acceptance',fin:'Final closure'}[e.k];modal(T,`${b.length?`<div class="dn">Open items: ${b.join('; ')}</div>${F('Authorised exception reason (required to proceed)','exc','')}`:''}${F('Reason / note','why','',{req:1})}`,(f,v)=>{const er={};if(!v.why.trim())er.why='Enter a reason or note';if(b.length&&e.k!=='app'&&!(v.exc||'').trim())er.exc='Closure is blocked. Record an authorised exception reason or resolve the open items.';if(e.k==='app'&&apRev(c)&&apRev(c).author===me.id)er.why='The report author cannot approve their own closure';if(Object.keys(er).length)return er;c.clo[e.k]={by:me.id,at:new Date().toISOString(),why:v.why,exc:(v.exc||'').trim()};log(c,T,v.why+(v.exc?' [EXCEPTION: '+v.exc+']':''));if(e.k==='res')setSt(c,'Resolved',v.why);if(e.k==='acc')setSt(c,'Customer accepted',v.why);if(e.k==='fin')setSt(c,'Closed',v.why);toast('Saved: '+T+' recorded');return 1})},

xkml:()=>{const P=[];S.cases.forEach(c=>{const r=curRev(c),g=r&&r.gps,xy=g?[g.lng,g.lat]:S.sites[c.site];if(!xy)return;(r?r.panels:[{label:'(site)',serial:''}]).forEach((p,i)=>P.push(`<Placemark><name>${E(c.id)} / Panel ${i+1}</name><description>${E('Case '+c.id+' | WO '+c.wo+' | Panel '+p.label+' | S/N '+p.serial+' | '+(g?'GPS '+g.method:'Registered site coordinates'))}</description><ExtendedData><Data name="caseId"><value>${E(c.id)}</value></Data><Data name="panelId"><value>${i+1}</value></Data></ExtendedData><Point><coordinates>${xy[0]},${xy[1]},0</coordinates></Point></Placemark>`))});(S.gpsPts||[]).forEach((g,i)=>P.push(`<Placemark><name>Captured point ${i+1}</name><description>${E(g.m+' | by '+usr(g.by).name+' | '+g.t)}</description><Point><coordinates>${g.lng},${g.lat},0</coordinates></Point></Placemark>`));dl('gps_sites_'+new Date().toISOString().slice(0,10)+'.kml','<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Alfanar Digital MV GPS export</name>'+P.join('')+'</Document></kml>','application/vnd.google-earth.kml+xml')},
